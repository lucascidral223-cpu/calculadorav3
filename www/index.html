<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculadora C.A.T.S</title>
<style>
:root{--bg:#0a0f1a;--panel:#131b2c;--line:#23304a;--text:#eaf0fb;--mute:#8896b3;--blue:#3d8bff;--red:#ff4d5e;--gold:#ffc83d;--ok:#2fd27a}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html,body{height:100%}
body{background:var(--bg);color:var(--text);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.hidden{display:none!important}
input,select,button{font-size:1rem;color:var(--text)}
input,select{background:#0a1120;border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;min-width:0}
input:focus,select:focus{border-color:var(--blue)}
button{border:0;border-radius:10px;padding:12px;font-weight:700;cursor:pointer;background:var(--blue)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* créditos */
.credits{text-align:center;color:var(--mute);font-size:.8rem;font-weight:600;letter-spacing:.06em;padding:18px 0 6px}
.credits b{color:var(--blue)}

/* login */
#login{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:28px;max-width:420px;margin:auto;width:100%}
#login h1{font-size:2.4rem;letter-spacing:-.03em;line-height:1}
#login p{color:var(--mute)}
#login-err{color:var(--red);min-height:1.2em}

/* app */
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
header b{font-size:1.1rem}
header span{color:var(--mute);font-size:.9rem}
header button{background:none;color:var(--mute);padding:6px 10px;border:1px solid var(--line)}
main{flex:1;overflow-y:auto;padding:16px;max-width:560px;width:100%;margin:0 auto}
nav{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border-radius:0;padding:14px 4px;color:var(--mute)}
nav button.on{color:var(--text);box-shadow:inset 0 3px 0 var(--gold)}

/* calculadora */
.team{border-radius:14px;padding:14px;margin-bottom:12px;display:grid;gap:10px}
.team.b{background:#0e2342;border-left:5px solid var(--blue)}
.team.r{background:#3a1220;border-left:5px solid var(--red)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row label{font-weight:600}
.row input{width:55%;text-align:right;font-size:1.3rem;font-weight:700}
.panel{background:var(--panel);border-radius:14px;padding:14px;margin-bottom:12px;display:grid;gap:10px}
.btn-n.off{background:#4a2026}.btn-n.on{background:#1d5b3a}

/* relógio (horas e minutos) */
.clock-box{display:grid;gap:8px;justify-items:center}
.clock-box>label{font-weight:600;justify-self:start}
.clock{display:flex;align-items:center;justify-content:center;gap:6px;background:#050a14;border:1px solid var(--line);border-radius:16px;padding:10px 16px;box-shadow:inset 0 0 22px rgba(61,139,255,.12)}
.clock .unit{display:grid;justify-items:center;gap:2px}
.clock .step{background:none;color:var(--mute);padding:4px 14px;font-size:.95rem;line-height:1;border-radius:8px}
.clock .step:active{color:var(--gold);background:var(--panel)}
.clock input{width:2.1ch;box-sizing:content-box;text-align:center;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;font-size:3rem;font-weight:700;line-height:1.1;color:var(--gold);background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;padding:0 2px;text-shadow:0 0 14px rgba(255,200,61,.35)}
.clock input:focus{border-bottom-color:var(--gold)}
.clock small{color:var(--mute);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
.clock .colon{font-family:ui-monospace,monospace;font-size:3rem;font-weight:700;color:var(--gold);line-height:1;margin-bottom:18px;animation:blink 1.6s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.clock .colon{animation:none}}
#result{background:var(--panel);border-radius:14px;padding:16px;border:1px solid var(--line)}
#result .who{font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
#result .who.b{color:var(--blue)}#result .who.r{color:var(--red)}
#result .sub{color:var(--mute);margin-top:6px;line-height:1.4}

/* ataques */
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.bar .count{color:var(--mute)}
.bar button{background:var(--panel);border:1px solid var(--line);color:var(--mute);padding:8px 12px}
.atk{display:grid;grid-template-columns:26px 1fr 64px 44px;gap:8px;align-items:center;margin-bottom:8px}
.atk i{color:var(--mute);font-style:normal;font-size:.85rem;text-align:right}
.atk select{padding:10px 4px}
.atk .tg{height:42px;padding:0;background:var(--panel);border:1px solid var(--line);color:var(--mute)}
.atk.done .tg{background:var(--ok);border-color:var(--ok);color:#04230f}
.atk.done input{opacity:.55;text-decoration:line-through}

/* chat */
#chat-wrap{display:flex;flex-direction:column;height:100%}
#msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:10px}
.msg{max-width:80%;padding:9px 12px;border-radius:14px;background:var(--panel);line-height:1.35;word-break:break-word}
.msg small{display:block;color:var(--mute);font-size:.72rem;margin-bottom:2px}
.msg.me{align-self:flex-end;background:#16407a}
#chat-form{display:flex;gap:8px;padding-top:8px}
#chat-in{flex:1}
#warn{background:#4a3a0e;color:var(--gold);padding:10px 14px;font-size:.9rem}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login">
  <h1>Calculadora<br>C.A.T.S</h1>
  <p>Digite seu nome de acesso para entrar.</p>
  <input id="login-in" placeholder="Nome de acesso" autocapitalize="characters" autocomplete="off">
  <button id="login-btn">Entrar</button>
  <div id="login-err"></div>
  <div class="credits">Desenvolvido por <b>NITRO ZEUS</b></div>
</section>

<!-- APP -->
<div id="app" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0">
  <div id="warn" class="hidden">Servidor não configurado: cole o firebaseConfig no código para ativar Ataques e Chat.</div>
  <header><b>Calculadora C.A.T.S</b><span><span id="me"></span> <button id="logout">Sair</button></span></header>
  <main>
    <!-- Calculadora -->
    <div id="tab-calc">
      <div class="team b">
        <div class="row"><label for="bp">PPM azul</label><input id="bp" type="number" inputmode="decimal" min="0" value="0"></div>
        <div class="row"><label for="bs">Pontos azul</label><input id="bs" type="number" inputmode="decimal" min="0" value="0"></div>
      </div>
      <div class="team r">
        <div class="row"><label for="rp">PPM vermelho</label><input id="rp" type="number" inputmode="decimal" min="0" value="0"></div>
        <div class="row"><label for="rs">Pontos vermelho</label><input id="rs" type="number" inputmode="decimal" min="0" value="0"></div>
      </div>
      <div class="panel">
        <div class="row"><label for="tot">Total do round</label><input id="tot" type="number" inputmode="decimal" min="0" value="0"></div>
        <div class="clock-box">
          <label for="th">Tempo restante</label>
          <div class="clock">
            <div class="unit">
              <button type="button" class="step" data-add="60" aria-label="Mais uma hora">▲</button>
              <input id="th" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" value="00" aria-label="Horas" autocomplete="off">
              <button type="button" class="step" data-add="-60" aria-label="Menos uma hora">▼</button>
              <small>horas</small>
            </div>
            <span class="colon" aria-hidden="true">:</span>
            <div class="unit">
              <button type="button" class="step" data-add="1" aria-label="Mais um minuto">▲</button>
              <input id="tn" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" value="00" aria-label="Minutos" autocomplete="off">
              <button type="button" class="step" data-add="-1" aria-label="Menos um minuto">▼</button>
              <small>minutos</small>
            </div>
          </div>
        </div>
        <button id="btn-n" class="btn-n off">Avisar no fim: desligado</button>
      </div>
      <div id="result"><div class="sub">Preencha os dados.</div></div>
      <div class="credits">Desenvolvido por <b>NITRO ZEUS</b></div>
    </div>

    <!-- Ataques -->
    <div id="tab-atk" class="hidden">
      <div class="bar"><span class="count" id="atk-count">0 de 25 atacaram</span><button id="atk-clear">Limpar lista</button></div>
      <div id="atk-list"></div>
    </div>

    <!-- Chat -->
    <div id="tab-chat" class="hidden" style="height:100%">
      <div id="chat-wrap">
        <div id="msgs"></div>
        <form id="chat-form"><input id="chat-in" placeholder="Mensagem" autocomplete="off"><button>Enviar</button></form>
      </div>
    </div>
  </main>
  <nav>
    <button data-tab="calc" class="on">Calculadora</button>
    <button data-tab="atk">Ataques</button>
    <button data-tab="chat">Chat</button>
  </nav>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ====== 1. COLE AQUI O SEU firebaseConfig ====== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCQ-0pD6CpvnTgIrwgweGnhaxud2NRAnQk",
  authDomain: "server-cats.firebaseapp.com",
  databaseURL: "https://server-cats-default-rtdb.firebaseio.com",
  projectId: "server-cats",
  storageBucket: "server-cats.firebasestorage.app",
  messagingSenderId: "236678400910",
  appId: "1:236678400910:web:316f4c47858193430572df"
};
/* =============================================== */

const USERS = ['NITRO','MAV','7200'];
const $ = id => document.getElementById(id);
let user = null, db = null;
const online = typeof firebase !== 'undefined' && FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith('COLE');
if (online) { firebase.initializeApp(FIREBASE_CONFIG); db = firebase.database(); }

/* ---------- Login ---------- */
function enter(name){
  user = name; localStorage.setItem('gb_user', name);
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('me').textContent = name;
  if (!online) $('warn').classList.remove('hidden');
  startSync();
}
$('login-btn').onclick = () => {
  const n = $('login-in').value.trim().toUpperCase();
  if (USERS.includes(n)) enter(n); else $('login-err').textContent = 'Nome não autorizado.';
};
$('login-in').addEventListener('keydown', e => { if (e.key === 'Enter') $('login-btn').click(); });
$('logout').onclick = () => { localStorage.removeItem('gb_user'); location.reload(); };
const saved = localStorage.getItem('gb_user');
if (USERS.includes(saved)) enter(saved);

/* ---------- Abas ---------- */
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  ['calc','atk','chat'].forEach(t => $('tab-'+t).classList.toggle('hidden', t !== b.dataset.tab));
  if (b.dataset.tab === 'chat') { $('msgs').scrollTop = 1e9; }
});

/* ---------- Calculadora ---------- */
let notifOn = false, target = null, fired = false, schedTimer = null;
const LN = () => window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications;

/* Relógio: só horas e minutos (sem segundos, sem precisar de ":") */
const pad2 = n => String(n).padStart(2,'0');
const MAXMIN = 99*60 + 59;
function clockMinutes(){
  const h = parseInt($('th').value,10)||0, m = parseInt($('tn').value,10)||0;
  return Math.min(h*60 + m, MAXMIN);
}
function setClock(total){
  total = Math.max(0, Math.min(MAXMIN, total));
  $('th').value = pad2(Math.floor(total/60));
  $('tn').value = pad2(total%60);
}
const secs = () => clockMinutes()*60;
const fmt = d => d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
function show(cls, who, sub){ $('result').innerHTML = `<div class="who ${cls}">${who}</div><div class="sub">${sub}</div>`; }

function calc(){
  const bp = +$('bp').value||0, bs = +$('bs').value||0, rp = +$('rp').value||0, rs = +$('rs').value||0;
  const tot = +$('tot').value||0, max = secs();
  target = null; fired = false;
  if (tot <= 0) return show('', 'Aguardando', 'Insira a pontuação total do round.'), schedule();
  if (bs >= tot && rs >= tot) return show('', 'Empate', 'As duas equipes já atingiram o total.');
  if (bs >= tot) return show('b', 'Azul', 'Já venceu.');
  if (rs >= tot) return show('r', 'Vermelho', 'Já venceu.');
  const bt = bp > 0 ? (tot-bs)/bp*60 : Infinity, rt = rp > 0 ? (tot-rs)/rp*60 : Infinity;
  let cls, who, sub, s;
  if (bt < rt && bt <= max)      { cls='b'; who='Azul';     s=bt; sub='Vence ao chegar no total em '; }
  else if (rt < bt && rt <= max) { cls='r'; who='Vermelho'; s=rt; sub='Vence ao chegar no total em '; }
  else if (max > 0) {
    const bf = bs + bp*max/60, rf = rs + rp*max/60; s = max; sub = 'Vence por pontos quando o tempo acabar em ';
    if (bf > rf) { cls='b'; who='Azul'; } else if (rf > bf) { cls='r'; who='Vermelho'; } else { cls=''; who='Empate'; }
  } else return show('', 'Aguardando', 'Informe PPM e tempo restante válidos.');
  target = new Date(Date.now() + Math.max(0, s)*1000);
  show(cls, who, sub + fmt(target));
  schedule();
}
['bp','bs','rp','rs','tot'].forEach(id => $(id).addEventListener('input', calc));

/* eventos do relógio */
['th','tn'].forEach(id => {
  const el = $(id);
  el.addEventListener('focus', () => setTimeout(() => el.select(), 0));
  el.addEventListener('input', () => {
    el.value = el.value.replace(/\D/g,'').slice(0,2);
    if (id === 'th' && el.value.length === 2) { $('tn').focus(); }   // pula pros minutos
    calc();
  });
  el.addEventListener('blur', () => { setClock(clockMinutes()); calc(); }); // 90 min vira 01:30
  el.addEventListener('keydown', e => { if (e.key === 'Enter') el.blur(); });
});
document.querySelectorAll('.clock .step').forEach(b => b.onclick = () => {
  setClock(clockMinutes() + (+b.dataset.add)); calc();
});

function beep(){
  try{
    const c = new (window.AudioContext||window.webkitAudioContext)();
    [[880,0],[880,.25],[1174.66,.5]].forEach(([f,t]) => {
      const o = c.createOscillator(), g = c.createGain();
      o.frequency.value = f; g.gain.setValueAtTime(.3, c.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.001, c.currentTime+t+.3);
      o.connect(g); g.connect(c.destination); o.start(c.currentTime+t); o.stop(c.currentTime+t+.3);
    });
  }catch(e){}
  if (navigator.vibrate) navigator.vibrate([300,150,300]);
}

/* Agenda notificação nativa (funciona com o app fechado no APK) */
function schedule(){
  clearTimeout(schedTimer);
  schedTimer = setTimeout(async () => {
    const ln = LN(); if (!ln) return;
    try{
      await ln.cancel({ notifications: [{ id: 1 }] });
      if (notifOn && target && target > new Date())
        await ln.schedule({ notifications: [{ id: 1, title: 'Fim da batalha', body: 'O tempo ou a pontuação da luta foi atingido.', schedule: { at: target, allowWhileIdle: true } }] });
    }catch(e){ console.error(e); }
  }, 600);
}

$('btn-n').onclick = async () => {
  if (!notifOn) {
    const ln = LN();
    try{
      if (ln) await ln.requestPermissions();
      else if ('Notification' in window) await Notification.requestPermission();
    }catch(e){}
  }
  notifOn = !notifOn;
  $('btn-n').className = 'btn-n ' + (notifOn ? 'on' : 'off');
  $('btn-n').textContent = 'Avisar no fim: ' + (notifOn ? 'ligado' : 'desligado');
  schedule();
};
/* Fallback com o app aberto */
setInterval(() => {
  if (notifOn && target && !fired && new Date() >= target) {
    fired = true; beep();
    if (!LN() && 'Notification' in window && Notification.permission === 'granted') new Notification('Fim da batalha', { body: 'O tempo ou a pontuação da luta foi atingido.' });
  }
}, 1000);
calc();

/* ---------- Lista de ataque (25 vagas, sincronizada) ---------- */
const N = 25, rows = [];
for (let i = 0; i < N; i++) {
  const d = document.createElement('div'); d.className = 'atk';
  d.innerHTML = `<i>${i+1}</i><input placeholder="Nome do jogador" maxlength="24" aria-label="Jogador ${i+1}">
    <select aria-label="Carros">${[0,1,2,3].map(n=>`<option>${n}</option>`).join('')}</select>
    <button class="tg" aria-label="Atacou" aria-pressed="false">✓</button>`;
  const [, name, cars, tg] = d.children;
  const write = patch => db && db.ref('attacks/'+i).update(patch);
  name.onchange = () => write({ name: name.value.trim() });
  cars.onchange = () => write({ cars: +cars.value });
  tg.onclick = () => write({ done: !d.classList.contains('done') });
  if (!db) tg.onclick = () => { d.classList.toggle('done'); count(); };
  $('atk-list').appendChild(d); rows.push({ d, name, cars });
}
function count(){ $('atk-count').textContent = rows.filter(r => r.d.classList.contains('done')).length + ' de ' + N + ' atacaram'; }
$('atk-clear').onclick = () => {
  if (!confirm('Limpar toda a lista de ataque?')) return;
  if (db) db.ref('attacks').remove();
  else rows.forEach(r => { r.name.value=''; r.cars.value=0; r.d.classList.remove('done'); count(); });
};

/* ---------- Chat ---------- */
function addMsg(m){
  const el = document.createElement('div'); el.className = 'msg' + (m.user === user ? ' me' : '');
  const t = new Date(m.ts).toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
  const s = document.createElement('small'); s.textContent = m.user + ' · ' + t;
  el.appendChild(s); el.appendChild(document.createTextNode(m.text));
  const box = $('msgs'), bottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  box.appendChild(el); if (bottom || m.user === user) box.scrollTop = 1e9;
}
$('chat-form').onsubmit = e => {
  e.preventDefault();
  const text = $('chat-in').value.trim(); if (!text || !db) return;
  db.ref('chat').push({ user, text, ts: firebase.database.ServerValue.TIMESTAMP });
  $('chat-in').value = '';
};

/* ---------- Liga o servidor após o login ---------- */
let synced = false;
function startSync(){
  if (!db || synced) return; synced = true;
  db.ref('attacks').on('value', snap => {
    const v = snap.val() || {};
    rows.forEach((r, i) => {
      const x = v[i] || {};
      if (document.activeElement !== r.name) r.name.value = x.name || '';
      r.cars.value = x.cars || 0;
      r.d.classList.toggle('done', !!x.done);
    });
    count();
  });
  db.ref('chat').limitToLast(100).on('child_added', s => addMsg(s.val()));
}
</script>
</body>
</html>
